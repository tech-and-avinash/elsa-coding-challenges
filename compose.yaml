version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: elsa_quiz_db
    restart: always
    environment:
      POSTGRES_USER: elsa
      POSTGRES_PASSWORD: elsapass
      POSTGRES_DB: elsa_quiz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elsa -d elsa_quiz"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: elsa_quiz_backend
    restart: always
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://elsa:elsapass@db:5432/elsa_quiz?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Containerfile
    container_name: elsa_quiz_frontend
    restart: always
    environment:
      BACKEND_URL: "http://backend:8080"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
